[package]
name = "gloob"
version = "0.1.0"
edition = "2024"
description = "a small gif picker for wayland"

[dependencies]
anyhow = "1"
gif = "0.13"
sha2 = "0.10"
tempfile = "3"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
